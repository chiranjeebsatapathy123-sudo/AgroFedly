{% extends "base.html" %}
{% load i18n %}
{% block title %}Method Not Allowed{% endblock %}
{% block content %}
<section class="form-page single">
  <div class="form-card" style="text-align: center;">
    <div class="eyebrow">Error 405</div>
    <h1>{% trans "Method Not Allowed" %}</h1>
    <p>{% trans "The HTTP method used is not allowed for this resource." %}</p>
    <a href="{% url 'dashboard' %}" class="btn primary">{% trans "Return to Dashboard" %}</a>
  </div>
</section>
{% endblock %}
