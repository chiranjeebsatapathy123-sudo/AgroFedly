{% extends "base.html" %}
{% block title %}Add Agricultural Produce{% endblock %}
{% block content %}
<section class="form-page">
    <div class="form-intro">
        <div class="eyebrow">AGRICULTURE</div>
        <h1>Add Harvested Produce</h1>
        <p>Register new raw agricultural produce into inventory.</p>
    </div>
    <div class="form-card">
        <form method="post" class="form-grid">
            {% csrf_token %}
            {% for field in form %}
            <label>{{ field.label }}
                {{ field }}
                {% if field.errors %}<div class="error-box" style="margin-top:5px; padding:5px;">{{ field.errors }}</div>{% endif %}
            </label>
            {% endfor %}
            <button class="btn primary full" type="submit">Add Produce</button>
        </form>
    </div>
</section>
{% endblock %}
