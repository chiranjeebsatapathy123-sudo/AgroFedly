{% extends "base.html" %}
{% load static i18n %}
{% block title %}{% if persona %}{{ persona|title }} {% endif %}Login{% endblock %}
{% block content %}
<section class="auth-wrap scene-3d-container">
  <div class="auth-card card-3d anim-fade-up" style="max-width: 400px; margin: 60px auto; padding: 40px; background: var(--surface); border-radius: 8px; border: 1px solid var(--border);">
    <h1 class="anim-fade-up stagger-2" style="font-size: 2rem; margin-bottom: 10px;">Welcome back</h1>
    <p class="anim-fade-in stagger-3" style="color: var(--text-muted); margin-bottom: 30px;">Sign in to AgroFedly</p>
    
    <form method="post" class="form-grid anim-scale-in stagger-4" onsubmit="window.ui && window.ui.setLoading(this.querySelector('button[type=submit]'), true)" style="display: flex; flex-direction: column; gap: 20px;">
      {% csrf_token %}
      <label style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-weight: 500;">Username</span>
        <input name="username" required autocomplete="username" style="padding: 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--background); color: var(--text);">
      </label>
      <label style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-weight: 500;">Password</span>
        <input name="password" type="password" required autocomplete="current-password" style="padding: 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--background); color: var(--text);">
      </label>
      
      <button type="submit" class="btn primary full" style="padding: 14px; font-size: 1.1rem; margin-top: 10px;">Sign in</button>
    </form>
    
    <div class="auth-foot anim-fade-in stagger-5" style="margin-top: 25px; text-align: center; font-size: 0.9rem;">
      New organization? <a href="{% url 'organization_register' %}" style="color: var(--primary); text-decoration: none; font-weight: bold;">Create account</a>
    </div>
  </div>
</section>

<script type="module">
  import { LoginScene } from "{% static 'js/3d_scenes/login_scene.js' %}";
  
  document.addEventListener('DOMContentLoaded', () => {
      if (window.agrofedly3D) {
          window.agrofedly3D.loadScene(LoginScene);
      }
      
      // Dynamic 3D tilt effect on the card
      const card = document.querySelector('.auth-card');
      if (card && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.addEventListener('mousemove', (e) => {
              const x = (window.innerWidth / 2 - e.clientX) / 50;
              const y = (window.innerHeight / 2 - e.clientY) / 50;
              card.style.transform = `translateY(-8px) translateZ(30px) rotateY(${x}deg) rotateX(${y}deg)`;
          });
      }
  });
</script>
{% endblock %}
