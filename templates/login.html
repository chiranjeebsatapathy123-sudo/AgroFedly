{% extends "base.html" %}
{% load i18n %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-card">
  <div class="eyebrow">{% trans "SECURE ACCESS" %}</div><h1>{% trans "Welcome back" %}</h1><p>{% trans "Sign in to your Fedly workspace." %}</p>
  <form method="post" class="form-grid">{% csrf_token %}
    <label>{% trans "Username" %}<input name="username" required autocomplete="username"></label>
    <label>{% trans "Password" %}<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary full">{% trans "Sign in" %}</button>
  </form>
  <div class="auth-foot">{% trans "New organization?" %} <a href="{% url 'organization_register' %}">{% trans "Register here" %}</a></div>
</div></section>
{% endblock %}
