{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-card">
  <div class="eyebrow">SECURE ACCESS</div><h1>Welcome back</h1><p>Sign in to your Fedly workspace.</p>
  <form method="post" class="form-grid">{% csrf_token %}
    <label>Username<input name="username" required autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary full">Sign in</button>
  </form>
  <div class="auth-foot">New organization? <a href="{% url 'organization_register' %}">Register here</a></div>
</div></section>
{% endblock %}
