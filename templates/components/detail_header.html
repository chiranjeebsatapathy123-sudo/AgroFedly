<!-- Reusable Detail Page Header -->
<div class="detail-header" style="display: flex; justify-content: space-between; align-items: flex-start; padding: 24px; background: var(--rd-surface, #ffffff); border-radius: 12px; border: 1px solid var(--color-border, #eee); margin-bottom: 24px;">
    
    <!-- Title and Status -->
    <div>
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
            <h1 style="margin: 0; font-size: 1.8rem; color: var(--color-text-primary, #000);">{{ title }}</h1>
            {% if status %}
                <span class="badge {{ status_color|default:'gray' }}">{{ status }}</span>
            {% endif %}
        </div>
        
        <!-- Context / Subtitle -->
        <div style="color: var(--color-text-secondary, #666); font-size: 0.95rem; display: flex; align-items: center; gap: 16px;">
            {% if subtitle %}
                <span><i class="fas fa-info-circle"></i> {{ subtitle }}</span>
            {% endif %}
            {% if location %}
                <span><i class="fas fa-map-marker-alt"></i> {{ location }}</span>
            {% endif %}
            {% if last_updated %}
                <span><i class="fas fa-clock"></i> Updated {{ last_updated|timesince }} ago</span>
            {% endif %}
        </div>
    </div>

    <!-- Actions Bar -->
    <div class="detail-actions" style="display: flex; gap: 12px; align-items: center;">
        {{ actions_html|safe }}
    </div>
</div>

<!-- Standardized Styles -->
<style>
.badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.badge.emerald { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
.badge.amber { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
.badge.blue { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.2); }
.badge.gray { background: rgba(107, 114, 128, 0.1); color: #6b7280; border: 1px solid rgba(107, 114, 128, 0.2); }
.badge.red { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
.dark-theme .detail-header { background: #1e2330; border-color: rgba(255,255,255,0.1); }
</style>
