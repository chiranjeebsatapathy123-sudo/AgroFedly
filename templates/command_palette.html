<!-- Command Palette Overlay -->

<style>
/* Command Palette Styles to replace Tailwind */
.cp-backdrop {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 10vh;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
}
.cp-backdrop.cp-show {
    opacity: 1;
    visibility: visible;
}
.cp-modal {
    width: 100%;
    max-width: 600px;
    background: var(--color-surface, #ffffff);
    border: 1px solid var(--color-border, #eee);
    border-radius: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    overflow: hidden;
    transform: scale(0.95);
    transition: transform 0.2s ease;
}
.dark-theme .cp-modal {
    background: #1e2330;
    border-color: rgba(255,255,255,0.1);
}
.cp-backdrop.cp-show .cp-modal {
    transform: scale(1);
}
.cp-header {
    display: flex;
    align-items: center;
    padding: 15px 20px;
    border-bottom: 1px solid var(--color-border, #eee);
}
.dark-theme .cp-header { border-color: rgba(255,255,255,0.1); }
.cp-header input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--color-text-primary, #000);
    font-size: 1.1rem;
    outline: none;
    margin-left: 10px;
}
.dark-theme .cp-header input { color: #fff; }
.cp-results-area {
    max-height: 60vh;
    overflow-y: auto;
    padding: 10px;
}
.cp-section-title {
    padding: 10px 15px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--color-text-secondary, #666);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.cp-item {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    border-radius: 8px;
    color: var(--color-text-primary, #000);
    text-decoration: none;
    transition: background 0.2s;
}
.dark-theme .cp-item { color: #ccc; }
.cp-item:hover {
    background: rgba(var(--color-primary-rgb, 0,0,0), 0.1);
}
.dark-theme .cp-item:hover {
    background: rgba(255,255,255,0.05);
    color: #fff;
}
.cp-item-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
}
.cp-item-icon.blue { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
.cp-item-icon.emerald { background: rgba(16, 185, 129, 0.2); color: #10b981; }
.cp-item-icon.amber { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
.cp-item-icon.gray { color: var(--color-text-secondary, #666); }

.cp-footer {
    padding: 10px 15px;
    background: rgba(0,0,0,0.05);
    border-top: 1px solid var(--color-border, #eee);
    font-size: 0.75rem;
    color: var(--color-text-secondary, #666);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.dark-theme .cp-footer { background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.05); }
.cp-hidden { display: none !important; }
</style>

<div id="command-palette-backdrop" class="cp-backdrop">
    <div id="command-palette" class="cp-modal">
        <div class="cp-header">
            <i class="fas fa-search" style="color: var(--color-text-secondary, #666);"></i>
            <input type="text" id="command-input" placeholder="Search operational data, actions, or type '/' for commands..." autocomplete="off" spellcheck="false">
            <span style="font-size:0.7rem; background:rgba(0,0,0,0.1); padding:2px 6px; border-radius:4px;">ESC</span>
        </div>
        
        <div class="cp-results-area custom-scrollbar" id="command-results">
            
            <div id="default-commands">
                <div class="cp-section-title">Quick Actions</div>
                <a href="{% url 'delivery_create' %}" class="cp-item">
                    <div class="cp-item-icon blue"><i class="fas fa-truck"></i></div>
                    <span style="flex:1">Schedule New Delivery</span>
                </a>
                <a href="{% url 'add_surplus' %}" class="cp-item">
                    <div class="cp-item-icon emerald"><i class="fas fa-leaf"></i></div>
                    <span style="flex:1">Log Surplus Produce</span>
                </a>
                <a href="{% url 'data_quality_center' %}" class="cp-item">
                    <div class="cp-item-icon amber"><i class="fas fa-shield-alt"></i></div>
                    <span style="flex:1">Run Quality Audit</span>
                </a>

                <div class="cp-section-title" style="margin-top:10px;">Navigation</div>
                <a href="{% url 'dashboard' %}" class="cp-item">
                    <div class="cp-item-icon gray"><i class="fas fa-hashtag"></i></div>
                    Dashboard
                </a>
                <a href="{% url 'surplus_list' %}" class="cp-item">
                    <div class="cp-item-icon gray"><i class="fas fa-hashtag"></i></div>
                    Inventory
                </a>
                <a href="{% url 'delivery_list' %}" class="cp-item">
                    <div class="cp-item-icon gray"><i class="fas fa-hashtag"></i></div>
                    Deliveries
                </a>
            </div>

            <div id="search-results" class="cp-hidden"></div>
            
            <div id="search-loading" class="cp-hidden" style="padding:30px; text-align:center; color:var(--color-text-secondary, #666);">
                <i class="fas fa-circle-notch fa-spin" style="font-size:2rem; color:var(--color-primary, #000); margin-bottom:10px;"></i>
                <p>Searching operational database...</p>
            </div>
            
            <div id="search-empty" class="cp-hidden" style="padding:30px; text-align:center; color:var(--color-text-secondary, #666);">
                <i class="fas fa-search" style="font-size:2rem; opacity:0.5; margin-bottom:10px;"></i>
                <p>No results found for "<span id="empty-query" style="color:var(--color-text-primary, #000); font-weight:bold;"></span>"</p>
            </div>
        </div>
        
        <div class="cp-footer">
            <div>
                <span><span style="background:rgba(0,0,0,0.1); padding:2px 4px; border-radius:3px;">↑↓</span> to navigate</span>
                <span style="margin-left:10px;"><span style="background:rgba(0,0,0,0.1); padding:2px 4px; border-radius:3px;">↵</span> to select</span>
            </div>
            <span><i class="fas fa-robot" style="color:var(--color-primary, #000);"></i> AI Search Active</span>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const backdrop = document.getElementById('command-palette-backdrop');
    const palette = document.getElementById('command-palette');
    const input = document.getElementById('command-input');
    const defaultCommands = document.getElementById('default-commands');
    const searchResults = document.getElementById('search-results');
    const searchLoading = document.getElementById('search-loading');
    const searchEmpty = document.getElementById('search-empty');
    const emptyQueryText = document.getElementById('empty-query');
    
    let isPaletteOpen = false;
    let searchTimeout = null;

    const togglePalette = (show) => {
        isPaletteOpen = show;
        if (show) {
            backdrop.classList.add('cp-show');
            // Small delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                
                
                input.focus();
            }, 10);
        } else {
            backdrop.classList.remove('cp-show');
            
            setTimeout(() => {
                
            }, 200);
            
            // Reset state
            input.value = '';
            defaultCommands.classList.remove('cp-hidden');
            searchResults.classList.add('cp-hidden');
            searchEmpty.classList.add('cp-hidden');
        }
    };

    // Keyboard Shortcuts (Ctrl+K or Cmd+K)
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            togglePalette(!isPaletteOpen);
        }
        if (e.key === 'Escape' && isPaletteOpen) {
            togglePalette(false);
        }
    });

    // Close on backdrop click
    backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) togglePalette(false);
    });

    // Handle Search Input
    input.addEventListener('input', (e) => {
        const query = e.target.value.trim();
        
        clearTimeout(searchTimeout);
        
        if (!query) {
            defaultCommands.classList.remove('cp-hidden');
            searchResults.classList.add('cp-hidden');
            searchLoading.classList.add('cp-hidden');
            searchEmpty.classList.add('cp-hidden');
            return;
        }

        defaultCommands.classList.add('cp-hidden');
        searchResults.classList.add('cp-hidden');
        searchEmpty.classList.add('cp-hidden');
        searchLoading.classList.remove('cp-hidden');

        // Debounce search
        searchTimeout = setTimeout(() => {
            fetch(`/api/search/?q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    searchLoading.classList.add('cp-hidden');
                    
                    if (!data.results || data.results.length === 0) {
                        searchEmpty.classList.remove('cp-hidden');
                        emptyQueryText.textContent = query;
                        return;
                    }
                    
                    // Render results
                    searchResults.innerHTML = '<div class="px-3 py-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">Search Results</div>';
                    
                    data.results.forEach(item => {
                        let icon = 'fa-search';
                        let url = '#';
                        let colorClass = 'text-gray-400 bg-gray-500/20';
                        
                        if (item.type === 'Produce') {
                            icon = 'fa-leaf';
                            url = '/surplus/';
                            colorClass = 'text-emerald-400 bg-emerald-500/20';
                        } else if (item.type === 'Delivery') {
                            icon = 'fa-truck';
                            url = `/deliveries/${item.id}/`;
                            colorClass = 'text-blue-400 bg-blue-500/20';
                        } else if (item.type === 'Organization') {
                            icon = 'fa-building';
                            url = '#';
                            colorClass = 'text-purple-400 bg-purple-500/20';
                        }

                        const el = document.createElement('a');
                        el.href = url;
                        el.className = 'flex items-center px-4 py-3 hover:bg-white/5 rounded-xl text-gray-300 hover:text-white transition-colors group';
                        el.innerHTML = `
                            <div class="w-8 h-8 rounded-lg ${colorClass} flex items-center justify-center mr-3"><i class="fas ${icon}"></i></div>
                            <div class="flex-1">
                                <div class="font-medium text-white">${item.name}</div>
                                <div class="text-xs text-gray-500">${item.type} &middot; ${item.details || ''}</div>
                            </div>
                            <i class="fas fa-arrow-right text-gray-600 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        `;
                        
                        // Click handler to close palette
                        el.addEventListener('click', () => togglePalette(false));
                        
                        searchResults.appendChild(el);
                    });
                    
                    searchResults.classList.remove('cp-hidden');
                })
                .catch(err => {
                    console.error('Search error:', err);
                    searchLoading.classList.add('cp-hidden');
                    searchEmpty.classList.remove('cp-hidden');
                    emptyQueryText.textContent = query + " (Error fetching)";
                });
        }, 300);
    });
});
</script>
