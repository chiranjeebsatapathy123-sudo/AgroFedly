{% extends "base.html" %}
{% block title %}Add Surplus{% endblock %}
{% block content %}
<section class="form-page single"><div class="form-card"><div class="eyebrow">SURPLUS FOOD</div><h1>Record surplus</h1><p>The organization is attached automatically. Safety is checked after saving.</p><form method="post" class="form-grid">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.errors %}<small class="field-error">{{ field.errors|striptags }}</small>{% endif %}</label>{% endfor %}<button class="btn primary">Save & Check Safety</button></form></div></section>
{% endblock %}
