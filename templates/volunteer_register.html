{% extends 'base.html' %}
{% block title %}Volunteer Registration{% endblock %}
{% block content %}
<div class="panel">
  <h2>Volunteer Driver Registration</h2>
  <p>Sign up to deliver surplus food and reduce waste.</p>
  <form method="post" class="standard-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Register / Update Profile</button>
  </form>
</div>
{% endblock %}
