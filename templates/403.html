{% extends "base.html" %}
{% load i18n %}
{% block title %}Forbidden{% endblock %}
{% block content %}
<section class="form-page single">

    <div class="eyebrow">Error 403</div>
    <h1>{% trans "Forbidden" %}</h1>

    <a href="{% url 'dashboard' %}" class="btn primary">{% trans "Return to Dashboard" %}</a>
  </div>
</section>
{% endblock %}
