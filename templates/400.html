{% extends "base.html" %}
{% load i18n %}
{% block title %}Bad Request{% endblock %}
{% block content %}
<section class="form-page single">
  <div class="form-card" style="text-align: center;">
    <div class="eyebrow">Error 400</div>
    <h1>{% trans "Bad Request" %}</h1>
    <p>{% trans "The request could not be understood by the server." %}</p>
    <a href="{% url 'dashboard' %}" class="btn primary">{% trans "Return to Dashboard" %}</a>
  </div>
</section>
{% endblock %}
