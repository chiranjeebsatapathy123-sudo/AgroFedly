version: '3.8'

services:
  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 AgroFedly.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgres://agro_user:agro_pass@db:5432/agrofedly
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A AgroFedly worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgres://agro_user:agro_pass@db:5432/agrofedly
    depends_on:
      - redis
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=agrofedly
      - POSTGRES_USER=agro_user
      - POSTGRES_PASSWORD=agro_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
