name: Django CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: agrofedly_test
          POSTGRES_USER: agro_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
          
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 celery redis psycopg2-binary
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Run Tests
      env:
        DATABASE_URL: postgres://agro_test:test_password@localhost:5432/agrofedly_test
        CELERY_BROKER_URL: redis://localhost:6379/0
      run: |
        python manage.py test feedly --noinput
